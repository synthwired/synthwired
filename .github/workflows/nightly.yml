name: Nightly build

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  nightly:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: docker
          tags: synthwired-dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/cache@v4
        with:
          path: |
            ~/pio
            .pio/libdeps
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'sdkconfig.*') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build firmware and filesystem
        run: |
          mkdir -p ~/pio
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "$PWD:/work" \
            -v "$HOME/pio:/pio" \
            synthwired-dev \
            sh -c "make build && make buildfs"

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Nightly $(date -u +%Y-%m-%d) (${GITHUB_SHA::7})"
          notes="Automatic build of ${GITHUB_SHA} from master."
          git tag -f nightly
          git push -f origin refs/tags/nightly
          if gh release view nightly > /dev/null 2>&1; then
            gh release edit nightly --prerelease --title "$title" --notes "$notes"
          else
            gh release create nightly --prerelease --title "$title" --notes "$notes" --verify-tag
          fi
          gh release upload nightly --clobber \
            .pio/build/twatchs3/firmware.factory.bin \
            .pio/build/twatchs3/firmware.bin \
            .pio/build/twatchs3/fatfs.bin \
            .pio/build/twatchs3/partitions.bin \
            .pio/build/twatchs3/firmware.elf
