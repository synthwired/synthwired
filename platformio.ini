; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; Environments:
;   twatchs3      the watch firmware, Arduino 3.x on ESP-IDF 5 (pioarduino)
;   twatchs3_old  the previous firmware, Arduino 2.x on ESP-IDF 4.4, kept as a fallback
;   emulator      the UI on the PC in an SDL window

[platformio]
default_envs = twatchs3
src_dir = src
boards_dir = ./boards

; Settings shared by both watch environments
[watch]
framework = arduino
board = lilygo-t-watch-s3
upload_speed = 115200
monitor_speed = 921600
monitor_filters =
	default
	esp32_exception_decoder
board_build.filesystem = fatfs
build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	-D CORE_DEBUG_LEVEL=0
	-D ARDUINO_T_WATCH_S3
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_LILYGO_LORA_SX1262
	-D RADIOLIB_EXCLUDE_RF69
	-D RADIOLIB_EXCLUDE_SX1231
	-D RADIOLIB_EXCLUDE_RFM2X
	-D RADIOLIB_EXCLUDE_SX127X
	-D RADIOLIB_EXCLUDE_AFSK
	-D RADIOLIB_EXCLUDE_AX25
	-D RADIOLIB_EXCLUDE_HELLSCHREIBER
	-D RADIOLIB_EXCLUDE_MORSE
	-D RADIOLIB_EXCLUDE_RTTY
	-D RADIOLIB_EXCLUDE_SSTV
	-D RADIOLIB_EXCLUDE_DIRECT_RECEIVE
	-D RADIOLIB_EXCLUDE_APRS
	-D RADIOLIB_EXCLUDE_BELL
	'-D LV_CONF_PATH="${PROJECT_DIR}/variants/lilygo_twatch_s3/lv_conf.h"'
	-I variants/lilygo_twatch_s3
build_src_flags =
	-Wall
	-Wextra
	-Wshadow
	-Wdouble-promotion
	-Wformat=2
	-Wnull-dereference
	-Wduplicated-cond
	-Wlogical-op
	-Wframe-larger-than=1024
lib_deps =
	; pinned to the commit verified on the watch (2025-12-19), newer versions change the API
	https://github.com/Xinyuan-LilyGO/LilyGoLib.git#a64fc6ca94757baa5401ad71b39fb7f92cd1a7e9
	lvgl/lvgl @ 9.4.0
	lewisxhe/XPowersLib @ ^0.3.1
	lewisxhe/SensorLib @ ^0.3.3
	mikalhart/TinyGPSPlus @ ^1.0.3
build_src_filter =
	+<*>
	-<emulator/>
	-<hardware/>
	+<hardware/lilygo_twatch_s3/>

; Arduino 3.x on ESP-IDF 5 with a custom sdkconfig, needed for BLE together with automatic light sleep.
; The custom sdkconfig makes pioarduino rebuild Arduino in the project (managed_components/, sdkconfig.*).
[env:twatchs3]
extends = watch
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
; the watch uses USB-Serial/JTAG (ARDUINO_USB_MODE=1), TinyUSB is off in the custom build and
; LilyGoLib only includes USB.h when !ARDUINO_USB_MODE, but the dependency finder pulls it in anyway
lib_ignore = USB
build_flags =
	${watch.build_flags}
	-Wl,--no-warn-execstack
build_src_flags =
	${watch.build_src_flags}
	-isystem .pio/libdeps/twatchs3/LilyGoLib/src
	-isystem .pio/libdeps/twatchs3/SensorLib/src
	-isystem .pio/libdeps/twatchs3/XPowersLib/src
	-isystem .pio/libdeps/twatchs3/RadioLib/src
	-isystem .pio/libdeps/twatchs3/TinyGPSPlus/src
	-isystem .pio/libdeps/twatchs3/lvgl
	-isystem ${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src
	-isystem ${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src
custom_sdkconfig =
	CONFIG_PM_ENABLE=y
	CONFIG_FREERTOS_USE_TICKLESS_IDLE=y
	CONFIG_BT_CTRL_MODEM_SLEEP=y
	CONFIG_BT_CTRL_MODEM_SLEEP_MODE_1=y
	CONFIG_BT_CTRL_LPCLK_SEL_MAIN_XTAL=y
	CONFIG_BT_CTRL_MAIN_XTAL_PU_DURING_LIGHT_SLEEP=y
custom_component_remove =
	espressif/mdns
	espressif/esp_modem
	espressif/esp-zboss-lib
	espressif/esp-zigbee-lib
	espressif/esp-dsp
	espressif/network_provisioning
	espressif/esp_rainmaker
	espressif/rmaker_common
	espressif/esp_insights
	espressif/esp_diag_data_store
	espressif/esp_diagnostics
	espressif/cbor
	espressif/qrcode
	espressif/esp-sr
	espressif/libsodium
	espressif/esp-modbus
	chmorgan/esp-libhelix-mp3

; Arduino 2.x on ESP-IDF 4.4, the firmware before the switch to Arduino 3.x
[env:twatchs3_old]
extends = watch
platform = espressif32@6.10.0
build_src_flags =
	${watch.build_src_flags}
	-isystem .pio/libdeps/twatchs3_old/LilyGoLib/src
	-isystem .pio/libdeps/twatchs3_old/SensorLib/src
	-isystem .pio/libdeps/twatchs3_old/XPowersLib/src
	-isystem .pio/libdeps/twatchs3_old/RadioLib/src
	-isystem .pio/libdeps/twatchs3_old/TinyGPSPlus/src
	-isystem .pio/libdeps/twatchs3_old/lvgl
; esptool 4.5.1 bundled with espressif32@6.10.0 fails with the stub flasher on this watch
platform_packages = platformio/tool-esptoolpy@~2.40900.0

; PC emulator in an SDL window, needs: sudo apt install libsdl2-dev
; run: pio run -e emulator -t exec
[env:emulator]
platform = native
build_flags =
	-D LV_CONF_INCLUDE_SIMPLE
	-I src/emulator
	-lSDL2
build_src_flags =
	-Wall
	-Wextra
	-Wshadow
	-Wdouble-promotion
	-Wformat=2
	-Wnull-dereference
	-Wframe-larger-than=1024
	-isystem .pio/libdeps/emulator/lvgl
; hardware code is replaced by src/emulator/
build_src_filter =
	+<*>
	-<main.cpp>
	-<hardware/>
lib_deps =
	lvgl/lvgl @ 9.4.0
