; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = twatchs3
src_dir = src
boards_dir = ./boards

[env_arduino]
framework = arduino
platform = espressif32@6.10.0
upload_speed = 921600
#upload_speed = 115200
board_build.filesystem = fatfs
;board_build.partitions = ${platformio.libdeps_dir}/${platformio.default_envs}/LilyGoLib/examples/factory/partitions.csv
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
    -D CORE_DEBUG_LEVEL=0
	-D RADIOLIB_EXCLUDE_RF69
	-D RADIOLIB_EXCLUDE_SX1231
	-D RADIOLIB_EXCLUDE_RFM2X
	-D RADIOLIB_EXCLUDE_SX127X
	-D RADIOLIB_EXCLUDE_AFSK
	-D RADIOLIB_EXCLUDE_AX25
	-D RADIOLIB_EXCLUDE_HELLSCHREIBER
	-D RADIOLIB_EXCLUDE_MORSE
	-D RADIOLIB_EXCLUDE_RTTY
	-D RADIOLIB_EXCLUDE_SSTV
	-D RADIOLIB_EXCLUDE_DIRECT_RECEIVE
	-D RADIOLIB_EXCLUDE_APRS
	-D RADIOLIB_EXCLUDE_BELL
	-Wnarrowing
		-D ARDUINO_LILYGO_LORA_SX1262
monitor_filters =
	default
	esp32_exception_decoder
lib_deps =
	https://github.com/Xinyuan-LilyGO/LilyGoLib
	lvgl/lvgl @ 9.4.0
	lewisxhe/XPowersLib@^0.3.1
	lewisxhe/SensorLib @ ^0.3.3
	mikalhart/TinyGPSPlus @ ^1.0.3
	earlephilhower/ESP8266Audio @ 2.0.0
	ESP32 BLE Arduino
	h2zero/NimBLE-Arduino @ ^2.2.3
extra_scripts = pre:scripts/touchRunAfterCompilation.py
build_src_filter =
	+<*>
	-<emulator/>

[env:twatchs3]
extends = env_arduino
board = lilygo-t-watch-s3
upload_speed = 115200
; esptool 4.5.1 bundled with espressif32@6.10.0 fails with the stub flasher on this watch
platform_packages = platformio/tool-esptoolpy@~2.40900.0
monitor_speed = 921600
build_flags =
	${env_arduino.build_flags}
	-D ARDUINO_T_WATCH_S3
    -D ARDUINO_USB_CDC_ON_BOOT=1
	-I variants/lilygo_twatch_s3
    -Iinclude
lib_deps =
	${env_arduino.lib_deps}
	https://github.com/tonhuisman/IRremoteESP8266/archive/refs/heads/feature/C++20-compatibility.zip

; PC emulator in an SDL window, needs: sudo apt install libsdl2-dev
; run: pio run -e emulator -t exec
[env:emulator]
platform = native
build_flags =
	-D LV_CONF_INCLUDE_SIMPLE
	-I src/emulator
	-lSDL2
; hardware code is replaced by src/emulator/
build_src_filter =
	+<*>
	-<main.cpp>
	-<core/core.cpp>
	-<core/run_after_upload.cpp>
	-<core/settings_storage.cpp>
	-<core/hardware/*.cpp>
lib_deps =
	lvgl/lvgl @ 9.4.0

